name: Terraform Plan

on:
  push:

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-files
          path: .
